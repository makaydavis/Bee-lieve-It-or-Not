services:
  - type: web
    name: bee-lieve-it-or-not
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: bee-lieve-it-or-not-db
          property: connectionString

databases:
  - name: bee-lieve-it-or-not-db
    plan: free
